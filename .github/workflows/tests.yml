name: telemetry-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q --cov=uav_telemetry --cov-report=term-missing
      - run: telemetry-monitor experiments --duration 1 --output /tmp/telemetry-smoke
      - run: telemetry-monitor rf --output /tmp/telemetry-rf
      - run: python scripts/verify_processes.py --output /tmp/telemetry-processes
