[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-telemetry-link-monitor"
version = "0.1.0"
description = "Read-only MAVLink telemetry monitoring with measured UDP impairment experiments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Afifah Khan"}]
dependencies = ["pymavlink>=2.4.49", "numpy>=1.26", "matplotlib>=3.8", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
telemetry-monitor = "uav_telemetry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"uav_telemetry.dashboard" = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["px4: opt-in live PX4 SITL integration (requires configured UDP stream)"]
